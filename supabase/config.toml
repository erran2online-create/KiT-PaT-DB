# This is the first config.toml in this repo. Every other edge function's
# verify_jwt setting is presently managed elsewhere (Supabase Dashboard and/or
# deploy-time flags) — see the P30 PR description for why only this one
# function is listed here, and why a bulk `supabase functions deploy` (no
# function name) should NOT be run until every function's real current
# setting has been confirmed and added.

[functions.delete-account-web]
# Must be reachable with no Authorization header at all — this is the public,
# unauthenticated deletion-info page Google Play requires a stable URL for.
verify_jwt = false

[functions.admin-write]
# Requires a valid Supabase Auth JWT: the platform rejects unauthenticated
# requests before the function even runs. The function itself re-derives
# the caller's identity from that JWT (never trusts a client-supplied role
# or email) and further requires an ACTIVE public.admins row for their
# email before allowing any write. Deploy by name only:
#   supabase functions deploy admin-write
verify_jwt = true

[functions.admin-reveal]
# Requires a valid Supabase Auth JWT (platform-level, same as admin-write).
# The function re-derives the caller's identity from that JWT and further
# requires an ACTIVE public.admins row with role='owner' before allowing a
# reveal request or confirmation; admin_request_reveal/admin_confirm_reveal
# independently re-check ownership server-side. Deploy by name only:
#   supabase functions deploy admin-reveal
verify_jwt = true
